<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRManagement</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 30px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }
  h1 { color: #38bdf8; margin: 0; font-size: 26px; }
  .version { font-size: 12px; color: #64748b; }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
    align-items: end;
  }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: #38bdf8; }
  button {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #0ea5e9; }
  .search { margin-bottom: 15px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td {
    text-align: left;
    padding: 12px 10px;
    border-bottom: 1px solid #334155;
    font-size: 14px;
  }
  th { color: #94a3b8; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover { background: #263449; }
  .del-btn {
    background: #ef4444;
    color: white;
    padding: 6px 12px;
    font-size: 12px;
  }
  .del-btn:hover { background: #dc2626; }
  .empty { text-align: center; color: #64748b; padding: 30px; }
  .badge {
    background: #0f172a;
    color: #38bdf8;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📇 Mini CRM</h1>
    <div class="version">Build Version: BUILD_NUMBER_PLACEHOLDER</div>
  </header>

  <div class="card">
    <div class="form-row">
      <div>
        <label>Customer Name</label>
        <input type="text" id="name" placeholder="e.g. Ahmed Khan">
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="email" placeholder="e.g. ahmed@example.com">
      </div>
      <div>
        <label>Phone</label>
        <input type="text" id="phone" placeholder="e.g. 0300-1234567">
      </div>
      <div>
        <button onclick="addCustomer()">+ Add Customer</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="search">
      <input type="text" id="searchBox" placeholder="🔍 Search customers..." oninput="renderTable()">
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Added</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none;">No customers yet. Add your first one above.</div>
  </div>

  <div class="card" style="text-align:center; font-size:13px; color:#64748b;">
    Total Customers: <span class="badge" id="totalCount">0</span>
  </div>
</div>

<script>
  let customers = [];

  function addCustomer() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!name) {
      alert('Customer name is required.');
      return;
    }

    customers.push({
      id: Date.now(),
      name,
      email: email || '-',
      phone: phone || '-',
      added: new Date().toLocaleDateString()
    });

    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
    document.getElementById('phone').value = '';

    renderTable();
  }

  function deleteCustomer(id) {
    customers = customers.filter(c => c.id !== id);
    renderTable();
  }

  function renderTable() {
    const search = document.getElementById('searchBox').value.toLowerCase();
    const filtered = customers.filter(c =>
      c.name.toLowerCase().includes(search) ||
      c.email.toLowerCase().includes(search) ||
      c.phone.toLowerCase().includes(search)
    );

    const tbody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');

    tbody.innerHTML = '';

    if (filtered.length === 0) {
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      filtered.forEach((c, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${i + 1}</td>
          <td>${c.name}</td>
          <td>${c.email}</td>
          <td>${c.phone}</td>
          <td>${c.added}</td>
          <td><button class="del-btn" onclick="deleteCustomer(${c.id})">Delete</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById('totalCount').textContent = customers.length;
  }

  renderTable();
</script>
</body>
</html>
